# Docker Compose configuration for Gemini Image/Video Generation Platform

services:
  # Python FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - ROOT_PATH=/HdMImageVideo
      - OLLAMA_URL=http://ollama:11434
    volumes:
      - ./backend/.media-storage:/app/.media-storage
      - ./backend/.video-jobs:/app/.video-jobs
      - ./backend/.data:/app/.data  # SQLite database persistence
      - ./backend/data:/app/data  # admin model config (admin-config.json)
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/HdMImageVideo/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Ollama: serves nomic-embed-text for the admin similarity comparison (internal only, no published port)
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped
    networks:
      - app-network

  # Next.js Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_BASE_PATH=/HdMImageVideo
      - NEXT_PUBLIC_API_URL=/HdMImageVideo
    volumes:
      - ./public:/app/public
    restart: unless-stopped
    networks:
      - app-network
    depends_on:
      - backend

volumes:
  ollama-models:

networks:
  app-network:
    driver: bridge
